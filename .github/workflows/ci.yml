name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege: jobs can only read the repository.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Cancel outdated runs of a pull request, never a run on main (it may be deploying).
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    name: Typecheck, lint, format, unit + component tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Read-only: issues are read by the traceability report (the current phase's stories).
    permissions:
      contents: read
      issues: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - name: Unit and component tests with coverage gate (src/domain >= 90 %)
        run: npm run test:coverage
      - name: Traceability report (informational, never fails the build)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: npm run trace

  # The one place that holds the Playwright version is package-lock.json. This job reads it
  # (no npm ci needed) so the E2E container image below always matches @playwright/test.
  playwright-version:
    name: Playwright version for the E2E image
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.lock.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - id: lock
        run: |
          version=$(jq -r '.packages["node_modules/@playwright/test"].version' package-lock.json)
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Could not read a release version of @playwright/test from package-lock.json (got '$version'). The E2E image tag needs one."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  e2e:
    name: E2E (mobile-chrome, mobile-safari, desktop-chrome)
    needs: playwright-version
    # Runs even when the version job fails: then the image tag has no version, the pull fails and this required
    # check fails too. A job skipped for a failed dependency would count as passed for branch protection.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Official Playwright image: browsers and their system libraries are already inside,
    # so this job installs no apt packages and no browsers. The tag follows @playwright/test.
    container:
      image: mcr.microsoft.com/playwright:v${{ needs.playwright-version.outputs.version }}-noble
      # Recommended by Playwright for GitHub Actions: the runner's own user (uid 1001).
      options: --user 1001
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run test:e2e
      - name: Upload Playwright report and traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14

  deploy:
    name: Deploy to GitHub Pages
    # Only after both gates pass, and only for commits on main (not pull requests).
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [quality, e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Least privilege: only this job may publish to Pages.
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          VITE_BASE: /MiAtlas67/
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v5
